<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111827">
<title>Confidential Election</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f5f7fb}
*{box-sizing:border-box}body{margin:0}.page{width:min(100% - 28px,760px);margin:0 auto;padding:28px 0 48px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:24px;box-shadow:0 8px 28px rgba(15,23,42,.06)}
h1{font-size:clamp(25px,6vw,34px);margin:0 0 8px}.intro{color:#667085;line-height:1.55;margin:0 0 22px}
label{font-weight:700;display:block;margin:16px 0 8px}
input[type=text]{width:100%;min-height:50px;border:1px solid #cfd4dc;border-radius:12px;padding:12px 14px;font-size:16px}
.choice{display:flex;align-items:center;gap:12px;border:1px solid #d7dbe2;border-radius:14px;padding:15px;margin:10px 0;min-height:52px;cursor:pointer;font-weight:650}
.choice input{width:20px;height:20px;flex:none}
button{width:100%;min-height:52px;border:0;border-radius:12px;background:#111827;color:white;font-size:16px;font-weight:800;cursor:pointer;margin-top:16px}
button:disabled{opacity:.55;cursor:not-allowed}
.message{display:none;margin-top:15px;padding:13px 14px;border-radius:12px;line-height:1.4}.success{display:block;background:#ecfdf3;color:#067647}.error{display:block;background:#fef3f2;color:#b42318}
.note{font-size:13px;color:#667085;margin-top:15px}
@media (min-width:700px){.card{padding:34px}.page{padding-top:54px}}
</style>
</head>
<body>
<main class="page">
<section class="card" aria-labelledby="title">
<h1 id="title">Confidential Election</h1>
<p class="intro">Enter your name and your personal voting code. Your name is used only to confirm the submission and is not stored with your ballot. Results are not shown to voters.</p>

<form id="voteForm">
<label for="name">Your name</label>
<input id="name" name="name" type="text" maxlength="100" autocomplete="name" required>

<label for="code">Personal voting code</label>
<input id="code" name="code" type="text" maxlength="20" autocomplete="off" autocapitalize="characters" required>

<label>Your candidate</label>
<label class="choice"><input type="radio" name="candidate" value="LIMBAYA DIEU DONNE (LIMBAX)" required><span>LIMBAYA DIEU DONNE (LIMBAX)</span></label>
<label class="choice"><input type="radio" name="candidate" value="GEDEON BOBOTO MINGA"><span>GEDEON BOBOTO MINGA</span></label>

<button id="submit" type="submit">SUBMIT VOTE</button>
<div id="message" class="message" role="status" aria-live="polite"></div>
<p class="note">Maximum capacity: 30 votes. Each personal code can be used once.</p>
</form>
</section>
</main>
<script>
const form = document.getElementById("voteForm");
const button = document.getElementById("submit");
const message = document.getElementById("message");

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  message.className = "message";
  message.textContent = "";
  button.disabled = true;

  const candidate = form.querySelector('input[name="candidate"]:checked')?.value;
  const payload = {
    name: form.name.value.trim(),
    code: form.code.value.trim().toUpperCase(),
    candidate
  };

  try {
    const response = await fetch("/.netlify/functions/vote", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(payload)
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "Your vote could not be submitted.");

    message.className = "message success";
    message.textContent = "Your vote has been recorded successfully.";
    form.querySelectorAll("input,button").forEach(el => el.disabled = true);
  } catch (error) {
    message.className = "message error";
    message.textContent = error.message;
    button.disabled = false;
  }
});
</script>
</body>
</html>
