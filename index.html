<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Confidential Election</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#111827;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{width:min(100% - 24px,680px);margin:auto;padding:24px 0 48px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:22px;box-shadow:0 8px 24px #0000000d}
h1{font-size:clamp(26px,7vw,36px);margin:0 0 8px}.intro{color:#667085;line-height:1.5}
label.title{display:block;font-weight:750;margin:20px 0 8px}input[type=text]{width:100%;height:54px;border:1px solid #cfd4dc;border-radius:12px;padding:12px 14px;font-size:17px}
.option{display:flex;align-items:center;gap:13px;border:1px solid #d9dde5;border-radius:14px;padding:16px;margin:10px 0;min-height:58px;font-weight:700;cursor:pointer}
.option input{width:22px;height:22px;flex:none}.submit{width:100%;height:56px;border:0;border-radius:12px;background:#111827;color:#fff;font-size:17px;font-weight:800;margin-top:18px}.submit:disabled{opacity:.55}
.message{display:none;margin-top:14px;padding:13px;border-radius:12px;line-height:1.4}.ok{display:block;background:#ecfdf3;color:#067647}.err{display:block;background:#fef3f2;color:#b42318}
.small{font-size:13px;color:#667085;margin-top:15px}
</style>
</head>
<body><main><section class="card">
<h1>Confidential Election</h1>
<p class="intro">Enter your name and choose one candidate. Your vote is recorded centrally. Results are not shown on this page.</p>
<form id="form">
<label class="title" for="name">Your name</label>
<input id="name" name="name" type="text" maxlength="100" autocomplete="name" required>
<label class="title">Choose one candidate</label>
<label class="option"><input type="radio" name="candidate" value="LIMBAYA DIEU DONNE (LIMBAX)" required><span>LIMBAYA DIEU DONNE (LIMBAX)</span></label>
<label class="option"><input type="radio" name="candidate" value="GEDEON BOBOTO MINGA"><span>GEDEON BOBOTO MINGA</span></label>
<button class="submit" id="submit" type="submit">SUBMIT VOTE</button>
<div id="message" class="message" aria-live="polite"></div>
<p class="small">Maximum 30 votes.</p>
</form></section></main>
<script>
const f=document.getElementById("form"),b=document.getElementById("submit"),m=document.getElementById("message");
f.addEventListener("submit",async e=>{
 e.preventDefault();b.disabled=true;m.className="message";
 const candidate=f.querySelector('input[name="candidate"]:checked')?.value;
 try{
  const r=await fetch("/api/vote",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:f.name.value.trim(),candidate})});
  const d=await r.json(); if(!r.ok) throw new Error(d.error||"Vote could not be submitted.");
  m.className="message ok";m.textContent="Your vote has been recorded successfully.";
  f.querySelectorAll("input,button").forEach(x=>x.disabled=true);
 }catch(err){m.className="message err";m.textContent=err.message;b.disabled=false;}
});
</script></body></html>
