<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Election Admin</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#111827;background:#f5f7fb}
*{box-sizing:border-box}body{margin:0}.page{width:min(100% - 28px,900px);margin:auto;padding:28px 0 50px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:22px;box-shadow:0 8px 28px rgba(15,23,42,.06);margin-bottom:16px}
h1{margin:0 0 5px;font-size:30px}.muted{color:#667085;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.stat{background:#f8fafc;border-radius:14px;padding:16px}.stat span{display:block;color:#667085;font-size:13px}.stat strong{display:block;font-size:28px;margin-top:5px}
.bar{height:18px;background:#e5e7eb;border-radius:999px;overflow:hidden}.fill{height:100%;background:#111827;width:0%;transition:width .25s}
.row{display:flex;justify-content:space-between;gap:12px;font-size:14px;font-weight:700}.leader{font-size:22px;font-weight:850}.closed{color:#b42318;font-weight:800}
button{min-height:46px;padding:10px 16px;border:0;border-radius:10px;background:#111827;color:white;font-weight:800;cursor:pointer}
@media(max-width:560px){.grid{grid-template-columns:1fr}.page{padding-top:18px}}
</style>
</head>
<body>
<main class="page">
<section class="card">
<h1>Election Admin Dashboard</h1>
<p class="muted">Aggregate results only. No voter names or individual ballot choices are stored or displayed here.</p>
<button id="refresh">Refresh results</button>
</section>
<section class="card">
<div class="grid">
<div class="stat"><span>Total votes</span><strong id="total">— / 30</strong></div>
<div class="stat"><span>Remaining</span><strong id="remaining">—</strong></div>
<div class="stat"><span>LIMBAX</span><strong id="limbax">—</strong></div>
<div class="stat"><span>GEDEON BOBOTO MINGA</span><strong id="gedeon">—</strong></div>
</div>
</section>
<section class="card">
<p class="muted">Current leader</p>
<div id="leader" class="leader">Loading…</div>
<p class="row"><span>LIMBAYA DIEU DONNE (LIMBAX)</span><span id="lp">0%</span></p>
<div class="bar"><div id="lb" class="fill"></div></div>
<p class="row"><span>GEDEON BOBOTO MINGA</span><span id="gp">0%</span></p>
<div class="bar"><div id="gb" class="fill"></div></div>
<p id="status" class="muted"></p>
</section>
</main>
<script>
async function loadResults(){
  const password = prompt("Admin password");
  if(password === null) return;
  const res = await fetch("/.netlify/functions/results", {
    headers: {"X-Admin-Password": password},
    cache: "no-store"
  });
  const data = await res.json();
  if(!res.ok){ alert(data.error || "Access denied."); return; }

  const total = data.total || 0;
  const limbax = data.limbax || 0;
  const gedeon = data.gedeon || 0;
  const lp = total ? Math.round(limbax / total * 100) : 0;
  const gp = total ? Math.round(gedeon / total * 100) : 0;

  document.getElementById("total").textContent = total + " / 30";
  document.getElementById("remaining").textContent = Math.max(0,30-total);
  document.getElementById("limbax").textContent = limbax;
  document.getElementById("gedeon").textContent = gedeon;
  document.getElementById("lp").textContent = lp + "%";
  document.getElementById("gp").textContent = gp + "%";
  document.getElementById("lb").style.width = lp + "%";
  document.getElementById("gb").style.width = gp + "%";
  document.getElementById("leader").textContent =
    total === 0 ? "No votes yet" :
    limbax === gedeon ? "TIE" :
    limbax > gedeon ? "LIMBAYA DIEU DONNE (LIMBAX)" : "GEDEON BOBOTO MINGA";
  document.getElementById("status").innerHTML =
    total >= 30 ? '<span class="closed">Voting closed — 30 votes received.</span>' :
    "Voting is open — " + (30-total) + " vote(s) remaining.";
}
document.getElementById("refresh").addEventListener("click", loadResults);
loadResults();
</script>
</body>
</html>
