<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Admin Dashboard — Confidential Election</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#111827;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{width:min(100% - 24px,900px);margin:auto;padding:20px 0 48px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:20px;margin-bottom:14px;box-shadow:0 8px 24px #0000000d}
h1{font-size:clamp(25px,6vw,34px);margin:0}.muted{color:#667085;line-height:1.45}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:#f8fafc;border-radius:14px;padding:15px}.stat small{display:block;color:#667085}.stat strong{font-size:28px;display:block;margin-top:4px}
.leader{font-size:clamp(20px,5vw,28px);font-weight:850}.row{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:750;margin-top:20px}.bar{height:18px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-top:7px}.fill{height:100%;background:#111827;border-radius:99px}
.refresh{width:100%;height:50px;border:0;border-radius:11px;background:#111827;color:#fff;font-weight:800;font-size:16px}
.closed{font-weight:800;color:#b42318}@media(max-width:520px){.grid{grid-template-columns:1fr}.card{padding:17px}}
</style>
</head>
<body><main>
<section class="card"><h1>Admin Dashboard</h1><p class="muted">Aggregate results only. Individual voter choices are not displayed.</p><button id="refresh" class="refresh">REFRESH RESULTS</button></section>
<section class="card"><div class="grid">
<div class="stat"><small>Total votes</small><strong id="total">— / 30</strong></div>
<div class="stat"><small>Remaining</small><strong id="remaining">—</strong></div>
<div class="stat"><small>LIMBAX</small><strong id="limbax">—</strong></div>
<div class="stat"><small>GEDEON BOBOTO MINGA</small><strong id="gedeon">—</strong></div>
</div></section>
<section class="card"><p class="muted">Current leader</p><div id="leader" class="leader">Loading…</div>
<div class="row"><span>LIMBAYA DIEU DONNE (LIMBAX)</span><span id="lp">0%</span></div><div class="bar"><div id="lb" class="fill"></div></div>
<div class="row"><span>GEDEON BOBOTO MINGA</span><span id="gp">0%</span></div><div class="bar"><div id="gb" class="fill"></div></div>
<p id="status" class="muted"></p></section>
</main>
<script>
async function load(){
 const p=prompt("Admin password");if(p===null)return;
 const r=await fetch("/api/results",{headers:{"X-Admin-Password":p},cache:"no-store"});const d=await r.json();
 if(!r.ok){alert(d.error||"Access denied");return}
 const t=d.total||0,l=d.limbax||0,g=d.gedeon||0,lp=t?Math.round(l/t*100):0,gp=t?Math.round(g/t*100):0;
 document.getElementById("total").textContent=t+" / 30";document.getElementById("remaining").textContent=30-t;
 document.getElementById("limbax").textContent=l;document.getElementById("gedeon").textContent=g;
 document.getElementById("lp").textContent=lp+"%";document.getElementById("gp").textContent=gp+"%";
 document.getElementById("lb").style.width=lp+"%";document.getElementById("gb").style.width=gp+"%";
 document.getElementById("leader").textContent=t===0?"No votes yet":l===g?"TIE":l>g?"LIMBAYA DIEU DONNE (LIMBAX)":"GEDEON BOBOTO MINGA";
 document.getElementById("status").innerHTML=t>=30?'<span class="closed">Voting closed — 30 votes received.</span>':"Voting is open — "+(30-t)+" vote(s) remaining.";
}
document.getElementById("refresh").onclick=load;load();
</script></body></html>
